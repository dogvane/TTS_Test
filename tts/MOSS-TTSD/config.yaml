# MOSS-TTSD 引擎配置

# webapi 地址（由网关自动启动，无需手动运行）
backend_url: "http://localhost:8004"

# webapi 端口（网关根据此端口自动启动后端）
webapi_port: 8004

# 请求超时（秒）
timeout: 300

# 音频参数（模型实际采样率，由 webapi 启动时自动检测）
sample_rate: 24000

# 模型路径（权重文件所在目录，WSL2 路径）
model_path: "/mnt/g/ai/TTS/MOSS-TTSD/models/MOSS-TTSD-v1.0"

# Audio Tokenizer 路径（WSL2 路径）
codec_path: "/mnt/g/ai/TTS/MOSS-TTSD/models/MOSS-Audio-Tokenizer"

# VoiceGenerator 模型路径（WSL2 路径，用于 voice_design）
voicegen_path: "/mnt/g/ai/TTS/MOSS-TTSD/models/MOSS-VoiceGenerator"

# 源代码路径（webapi.py 通过 sys.path 引入，WSL2 路径）
source_path: "/mnt/g/ai/TTS/MOSS-TTSD/MOSS-TTSD"

# 推理设备
device: "cuda"
